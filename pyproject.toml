[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stopslop-local"
version = "0.1.0"
description = "Local analysis adapter for the StopSlop macOS application"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
stopslop-analyse = "stopslop_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
